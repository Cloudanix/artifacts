AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Test VPC for QA validation of the Wazuh EKS stack. Creates a VPC with 2 private
  subnets (2 AZs, EKS requirement) and 2 public subnets (2 AZs — NLB needs
  subnets in at least two AZs for an internet-facing load balancer). Includes an
  internet gateway, a NAT gateway on PublicSubnet1 (so private-subnet nodes can
  pull images), and route tables wired correctly.
  
  For production customers this template is NOT used — the customer provides their
  own VPC + subnets. This exists purely for test/QA.

Parameters:
  VpcCidr:
    Type: String
    Default: '10.100.0.0/16'
  PublicSubnet1Cidr:
    Type: String
    Default: '10.100.1.0/24'
  PublicSubnet2Cidr:
    Type: String
    Default: '10.100.2.0/24'
  PrivateSubnet1Cidr:
    Type: String
    Default: '10.100.10.0/24'
  PrivateSubnet2Cidr:
    Type: String
    Default: '10.100.20.0/24'

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: wazuh-test-vpc

        - Key: aws-apn-id
          Value: pc:2k1o8bijfwf7aykfulhgkc2uo
        - Key: Created_by
          Value: Cloudanix
        - Key: Environment
          Value: Prod
        - Key: purpose
          Value: wazuh_vm_scan

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: wazuh-test-igw

        - Key: aws-apn-id
          Value: pc:2k1o8bijfwf7aykfulhgkc2uo
        - Key: Created_by
          Value: Cloudanix
        - Key: Environment
          Value: Prod
        - Key: purpose
          Value: wazuh_vm_scan

  AttachIGW:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # ---- Public subnets (NLB needs 2 AZs) ----
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: wazuh-test-public-1

        - Key: aws-apn-id
          Value: pc:2k1o8bijfwf7aykfulhgkc2uo
        - Key: Created_by
          Value: Cloudanix
        - Key: Environment
          Value: Prod
        - Key: purpose
          Value: wazuh_vm_scan

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: wazuh-test-public-2

        - Key: aws-apn-id
          Value: pc:2k1o8bijfwf7aykfulhgkc2uo
        - Key: Created_by
          Value: Cloudanix
        - Key: Environment
          Value: Prod
        - Key: purpose
          Value: wazuh_vm_scan

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: wazuh-test-public-rt

        - Key: aws-apn-id
          Value: pc:2k1o8bijfwf7aykfulhgkc2uo
        - Key: Created_by
          Value: Cloudanix
        - Key: Environment
          Value: Prod
        - Key: purpose
          Value: wazuh_vm_scan

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachIGW
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: '0.0.0.0/0'
      GatewayId: !Ref InternetGateway

  PublicSubnet1RTAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RTAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  # ---- NAT gateway (private nodes need outbound for image pulls) ----
  NatEIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: wazuh-test-nat-eip
        - Key: aws-apn-id
          Value: pc:2k1o8bijfwf7aykfulhgkc2uo
        - Key: Created_by
          Value: Cloudanix
        - Key: Environment
          Value: Prod
        - Key: purpose
          Value: wazuh_vm_scan

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      SubnetId: !Ref PublicSubnet1
      AllocationId: !GetAtt NatEIP.AllocationId
      Tags:
        - Key: Name
          Value: wazuh-test-nat

        - Key: aws-apn-id
          Value: pc:2k1o8bijfwf7aykfulhgkc2uo
        - Key: Created_by
          Value: Cloudanix
        - Key: Environment
          Value: Prod
        - Key: purpose
          Value: wazuh_vm_scan

  # ---- Private subnets (2 AZs — EKS requirement) ----
  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: wazuh-test-private-1

        - Key: aws-apn-id
          Value: pc:2k1o8bijfwf7aykfulhgkc2uo
        - Key: Created_by
          Value: Cloudanix
        - Key: Environment
          Value: Prod
        - Key: purpose
          Value: wazuh_vm_scan

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: wazuh-test-private-2

        - Key: aws-apn-id
          Value: pc:2k1o8bijfwf7aykfulhgkc2uo
        - Key: Created_by
          Value: Cloudanix
        - Key: Environment
          Value: Prod
        - Key: purpose
          Value: wazuh_vm_scan

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: wazuh-test-private-rt

        - Key: aws-apn-id
          Value: pc:2k1o8bijfwf7aykfulhgkc2uo
        - Key: Created_by
          Value: Cloudanix
        - Key: Environment
          Value: Prod
        - Key: purpose
          Value: wazuh_vm_scan

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: '0.0.0.0/0'
      NatGatewayId: !Ref NatGateway

  PrivateSubnet1RTAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RTAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

Outputs:
  VpcId:
    Value: !Ref VPC
    Export:
      Name: wazuh-test-vpc-id
  PublicSubnet1Id:
    Value: !Ref PublicSubnet1
    Export:
      Name: wazuh-test-public-subnet-1
  PublicSubnet2Id:
    Value: !Ref PublicSubnet2
    Export:
      Name: wazuh-test-public-subnet-2
  PrivateSubnet1Id:
    Value: !Ref PrivateSubnet1
    Export:
      Name: wazuh-test-private-1
  PrivateSubnet2Id:
    Value: !Ref PrivateSubnet2
    Export:
      Name: wazuh-test-private-2
  FillParameters:
    Description: Copy-paste for parameters.json
    Value: !Sub |
      "VpcId": "${VPC}",
      "PrivateSubnetIds": "${PrivateSubnet1},${PrivateSubnet2}",
      "PublicSubnetIds": "${PublicSubnet1},${PublicSubnet2}"
