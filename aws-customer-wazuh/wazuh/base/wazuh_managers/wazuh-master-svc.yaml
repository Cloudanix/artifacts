apiVersion: v1
kind: Service
metadata:
  name: wazuh
  namespace: wazuh
  labels:
    node-type: master
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    service.beta.kubernetes.io/aws-load-balancer-target-type: ip
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-interval: "300"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-timeout: "120"
    service.beta.kubernetes.io/aws-load-balancer-healthy-threshold: "2"
    service.beta.kubernetes.io/aws-load-balancer-unhealthy-threshold: "10"
    # NOTE: no hardcoded aws-load-balancer-subnets pin. The LB Controller
    # auto-discovers public subnets tagged kubernetes.io/role/elb=1 (tagged by
    # infra/deploy.sh) across ALL AZs. Combined with cross-zone LB above, the NLB
    # reaches master targets in any AZ. (Pinning a single-AZ subnet here is what
    # previously blackholed traffic when pods scheduled in another AZ.)
spec:
  type: LoadBalancer
  ports:
  - name: registration
    port: 1515
    targetPort: 1515
    protocol: TCP
  - name: api
    port: 55000
    targetPort: 55000
    protocol: TCP
  selector:
    app: wazuh-manager
    node-type: master