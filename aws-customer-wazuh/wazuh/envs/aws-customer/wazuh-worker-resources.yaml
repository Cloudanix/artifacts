# Workers: 3 replicas pinned to the dedicated, tainted worker node group.
# The nodeSelector + toleration match the worker-ng label/taint from the
# CloudFormation node-group stack (workload=wazuh-worker:NoSchedule).
#
# NLB / single-public-subnet note:
#   An internet-facing NLB only registers targets in AZs where it has a subnet.
#   If the customer has ONE public subnet (one AZ) but workers schedule across
#   two private AZs, targets in the other AZ stay "unused" and 1514 times out.
#   Prefer 2+ public subnets (see README + 00-test-vpc). If only one public
#   subnet is possible, uncomment the nodeAffinity block below and set the zone
#   to match that public subnet's AZ so all workers land in the NLB's AZ.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wazuh-manager-worker
  namespace: wazuh
spec:
  replicas: 3
  template:
    spec:
      # IRSA SA (created + annotated by infra/deploy.sh) so the cloudanix
      # integration can read the cdx-central-vm-auth-tokens Secrets Manager secret.
      serviceAccountName: wazuh-manager
      nodeSelector:
        workload: wazuh-worker
      tolerations:
        - key: workload
          operator: Equal
          value: wazuh-worker
          effect: NoSchedule
      # OPTIONAL — single public subnet / single NLB AZ only:
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #         - matchExpressions:
      #             - key: topology.kubernetes.io/zone
      #               operator: In
      #               values: ["us-east-1a"]   # <-- AZ of the public subnet
      securityContext:
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: fix-logs-permissions
          image: public.ecr.aws/docker/library/busybox:1.36
          command:
            - sh
            - -c
            - >-
              mkdir -p /var/ossec/logs/alerts
              /var/ossec/logs/archives
              /var/ossec/logs/firewall
              /var/ossec/logs/api
              /var/ossec/logs/cluster
              /var/ossec/logs/wazuh
              /var/ossec/etc/shared
              /var/ossec/etc/shared/default
              /var/ossec/queue/db
              /var/ossec/queue/sockets
              /var/ossec/queue/alerts
              /var/ossec/queue/cluster
              /var/ossec/queue/agent-groups
              /var/ossec/queue/agent-info
              /var/ossec/queue/fts
              /var/ossec/queue/diff
              /var/ossec/queue/fim
              /var/ossec/queue/logcollector
              /var/ossec/queue/rids
              /var/ossec/queue/syscheck
              /var/ossec/queue/tasks &&
              touch /var/ossec/logs/cloudanix-push-alerts.log
              /var/ossec/etc/shared/ar.conf
              /var/ossec/queue/fts/fts-queue
              /var/ossec/queue/fts/hostinfo &&
              if [ ! -s /var/ossec/etc/shared/default/agent.conf ]; then printf '%s\n' '<agent_config>' '</agent_config>' > /var/ossec/etc/shared/default/agent.conf; fi &&
              chown -R 999:999 /var/ossec/logs &&
              chown -R 999:999 /var/ossec/etc/shared &&
              chown -R 999:999 /var/ossec/queue &&
              chmod -R 770 /var/ossec/logs/alerts /var/ossec/logs/archives /var/ossec/logs/firewall &&
              chmod 664 /var/ossec/logs/cloudanix-push-alerts.log &&
              chmod 755 /var/ossec/etc/shared /var/ossec/etc/shared/default &&
              chmod 644 /var/ossec/etc/shared/ar.conf &&
              chmod 640 /var/ossec/etc/shared/default/agent.conf &&
              chmod 770 /var/ossec/queue/db /var/ossec/queue/alerts /var/ossec/queue/fts &&
              chmod 660 /var/ossec/queue/fts/fts-queue /var/ossec/queue/fts/hostinfo &&
              if [ -f /var/ossec/etc/ossec.conf ]; then chmod 644 /var/ossec/etc/ossec.conf; fi &&
              if [ -f /var/ossec/etc/client.keys ]; then chown 0:999 /var/ossec/etc/client.keys; chmod 640 /var/ossec/etc/client.keys; fi
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: wazuh-manager-worker
              mountPath: /var/ossec/logs
              subPath: wazuh/var/ossec/logs
            - name: wazuh-manager-worker
              mountPath: /var/ossec/etc
              subPath: wazuh/var/ossec/etc
            - name: wazuh-manager-worker
              mountPath: /var/ossec/queue
              subPath: wazuh/var/ossec/queue
      containers:
        - name: wazuh-manager
          # On AWS/EKS the master API Service is named "wazuh". Inject so
          # cloudanix-config.json gets a real WAZUH_SERVER_IP.
          env:
            - name: WAZUH_SERVER_IP
              value: wazuh.wazuh.svc.cluster.local
          resources:
            requests:
              cpu: 1
              memory: 2Gi
            limits:
              cpu: 2
              memory: 4Gi
  volumeClaimTemplates:
    - metadata:
        name: wazuh-manager-worker
        namespace: wazuh
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: wazuh-storage
        resources:
          requests:
            storage: 50Gi
