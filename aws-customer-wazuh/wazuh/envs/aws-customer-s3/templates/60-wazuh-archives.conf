# Spool Wazuh raw archive events into per-minute NDJSON files for S3 upload.
#
# The filename MUST stay 60-wazuh-archives.conf: start-worker.sh only launches
# rsyslogd when /etc/rsyslog.d/60-wazuh-archives.conf exists.
#
# This is the S3 variant of the archive drop-in. The forwarding variant
# (envs/aws-customer-forward) sends the same stream over UDP instead; the two
# are mutually exclusive because they claim the same file.

module(load="imfile" mode="polling" PollingInterval="10")

input(type="imfile"
      File="/var/ossec/logs/archives/archives.json"
      Tag="wazuh-archive:"
      Severity="info"
      Facility="local0"
      readMode="0"
      MaxLinesAtOnce="100000"
      PersistStateInterval="20"
      reopenOnTruncate="on"
      deleteStateOnFileDelete="on")

# <spool>/<YYYY-MM-DD>/<HH>/<MM>.json, named from rsyslog's clock at write time.
template(name="minutePath" type="string"
         string="__SPOOL_DIR__/%$year%-%$month%-%$day%/%$hour%/%$minute%.json")

# One original Wazuh JSON event per line, byte-for-byte unmodified.
template(name="rawEvent" type="string" string="%rawmsg%\n")

if $programname == 'wazuh-archive' then {
    action(type="omfile"
           dynaFile="minutePath"
           dynaFileCacheSize="4"
           template="rawEvent"
           createDirs="on"
           # rsyslogd runs as root, the uploader runs as wazuh (999) under cron.
           # Without these the spool tree is root-owned and the uploader can read
           # the files but cannot unlink them, so nothing is ever cleaned up.
           fileOwnerNum="999"
           fileGroupNum="999"
           dirOwnerNum="999"
           dirGroupNum="999"
           dirCreateMode="0750"
           fileCreateMode="0640"
           closeTimeout="2")
    stop
}
